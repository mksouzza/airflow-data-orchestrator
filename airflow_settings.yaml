# Airflow local development settings (Astronomer Astro CLI)
# Automatically imported on 'astro dev start'
airflow:
  connections:
    - conn_id: postgres_warehouse
      conn_type: postgres
      conn_host: localhost
      conn_schema: commodities_dw
      conn_login: postgres
      conn_password: postgres
      conn_port: 5432
      conn_extra:
        sslmode: disable

  variables:
    - variable_name: COMMODITIES_TRACKED_SYMBOLS
      variable_value: "CL=F,GC=F,SI=F"
    - variable_name: PIPELINE_ALERT_EMAIL
      variable_value: "mksouzza@gmail.com"
    - variable_name: SLA_MAX_HOURS_STALENESS
      variable_value: "24"

  pools:
    - pool_name: elt_ingestion_pool
      pool_slot: 4
      pool_description: "Worker slots reserved for high-frequency extraction and ingestion tasks"
