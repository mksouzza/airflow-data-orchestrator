[project]
name = "airflow-data-orchestrator"
version = "1.0.0"
description = "Production-grade workflow orchestration with Apache Airflow and Astronomer for Modern Data Stack pipelines."
authors = [
    {name = "Marcos Vinicius Simao de Souza", email = "mksouzza@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "apache-airflow (>=2.8.0,<4.0.0)",
    "requests (>=2.31.0)",
    "pydantic (>=2.0.0)",
    "pendulum (>=3.0.0)"
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
